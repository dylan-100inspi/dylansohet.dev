name: Links

on:
  pull_request:

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # External rate-limits/bot-blocks (429/403) pass; genuine internal 404s fail the check.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --base dist --accept 200,206,429,403 --no-progress "dist/**/*.html"
          fail: true
