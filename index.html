<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dylan Sohet — Site in progress</title>
    <meta
      name="description"
      content="dylansohet.dev is being built. Full Stack Developer — coming soon."
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dylan Sohet — Site in progress" />
    <meta
      property="og:description"
      content="dylansohet.dev is being built. Full Stack Developer — coming soon."
    />
    <meta property="og:url" content="https://dylansohet.dev/" />
    <meta name="twitter:card" content="summary" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Cg fill='none' stroke='%232dd4bf' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 11 L7 16 L12 21'/%3E%3Cpath d='M20 11 L25 16 L20 21'/%3E%3Cpath d='M17.5 9 L14.5 23'/%3E%3C/g%3E%3C/svg%3E"
    />

    <style>
      :root {
        --bg: #0f172a;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #2dd4bf;
        --line: rgba(148, 163, 184, 0.14);
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(1rem, 4vw, 2rem);
        background:
          radial-gradient(1000px 500px at 50% -10%, rgba(45, 212, 191, 0.09), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      main {
        text-align: center;
        max-width: 48rem;
        width: 100%;
      }

      /* --- Animated wordmark: DYLAN </> SOHET --- */
      .wm {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.14em;
        font-family: var(--mono);
        font-weight: 800;
        font-style: italic;
        letter-spacing: -0.02em;
        line-height: 1;
        white-space: nowrap;
        user-select: none;
        max-width: 100%;
        font-size: clamp(1.6rem, 0.6rem + 6.5vw, 5.5rem);
      }

      .wm-word {
        display: inline-block;
        color: var(--text);
        transform: skewX(-4deg) translateX(0);
        opacity: 1;
      }
      .wm-right {
        color: var(--accent);
      }

      .wm-code {
        width: 1.5em;
        height: auto;
        flex-shrink: 0;
        overflow: visible;
        color: var(--accent);
        transform: skewX(-4deg);
        margin-left: 0.09em;
      }

      @media (prefers-reduced-motion: no-preference) {
        .wm-left {
          animation: slide-left 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        .wm-right {
          animation: slide-right 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.05s both;
        }
        .wm-code {
          animation: spin-in 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s both;
        }
      }

      @keyframes slide-left {
        from {
          opacity: 0;
          transform: skewX(-4deg) translateX(-40%);
        }
        to {
          opacity: 1;
          transform: skewX(-4deg) translateX(0);
        }
      }
      @keyframes slide-right {
        from {
          opacity: 0;
          transform: skewX(-4deg) translateX(40%);
        }
        to {
          opacity: 1;
          transform: skewX(-4deg) translateX(0);
        }
      }
      @keyframes spin-in {
        from {
          opacity: 0;
          transform: skewX(-4deg) rotate(-180deg) scale(0.4);
        }
        to {
          opacity: 1;
          transform: skewX(-4deg) rotate(0) scale(1);
        }
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.6rem;
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.4rem 0.85rem;
      }
      .badge .pulse {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 2s ease-out infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.55);
        }
        100% {
          box-shadow: 0 0 0 10px rgba(45, 212, 191, 0);
        }
      }

      .role {
        margin: 1.4rem 0 0;
        font-family: var(--mono);
        font-size: 0.86rem;
        letter-spacing: 0.08em;
        color: #cbd5e1;
      }
      .role strong {
        color: var(--text);
      }

      /* Indeterminate "building" progress bar. */
      .progress {
        margin: 1.6rem auto 0;
        width: min(280px, 70%);
        height: 4px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.16);
        overflow: hidden;
        position: relative;
      }
      .progress::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        animation: slide 1.8s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      .status {
        margin-top: 0.9rem;
        font-family: var(--mono);
        font-size: 0.78rem;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      .footer {
        margin-top: 2.4rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        flex-wrap: wrap;
      }

      a.link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--text);
        text-decoration: none;
        font-size: 0.9rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.5rem 1rem;
        transition:
          border-color 0.18s ease,
          color 0.18s ease;
      }
      a.link:hover,
      a.link:focus-visible {
        color: var(--accent);
        border-color: var(--accent);
      }
      a.link svg {
        width: 16px;
        height: 16px;
      }

      .toggle {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 999px;
        overflow: hidden;
        font-family: var(--mono);
      }
      .toggle button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        padding: 0.5rem 0.8rem;
        cursor: pointer;
      }
      .toggle button[aria-pressed='true'] {
        background: var(--accent);
        color: #04241f;
        font-weight: 700;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 6px;
      }

      @media (max-width: 480px) {
        .badge {
          margin-bottom: 1.2rem;
        }
        .footer {
          margin-top: 1.8rem;
          gap: 0.9rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .badge .pulse,
        .progress::before {
          animation: none;
        }
        .progress::before {
          width: 100%;
          transform: none;
          background: var(--accent);
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <main role="main">
      <span class="badge"
        ><span class="pulse" aria-hidden="true"></span><span data-i18n="badge">Building</span></span
      >

      <div class="wm" aria-label="Dylan Sohet">
        <span class="wm-word wm-left" aria-hidden="true">DYLAN</span>
        <svg class="wm-code" viewBox="0 0 44 24" aria-hidden="true">
          <path
            d="M14 5 L5 12 L14 19"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M26 3 L18 21"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />
          <path
            d="M30 5 L39 12 L30 19"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="wm-word wm-right" aria-hidden="true">SOHET</span>
      </div>

      <p class="role">
        <strong>Dylan Sohet</strong> — <span data-i18n="role">Full Stack Developer</span>
      </p>

      <div class="progress" role="progressbar" aria-label="Site build in progress"></div>
      <p class="status" data-i18n="status">Site in progress — coming soon</p>

      <div class="footer">
        <a
          class="link"
          href="https://www.linkedin.com/in/dylan-sohet"
          rel="noopener"
          aria-label="LinkedIn"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M4.98 3.5A2.5 2.5 0 1 0 5 8.5a2.5 2.5 0 0 0-.02-5ZM3 9h4v12H3V9Zm7 0h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21H18v-5.4c0-1.29-.02-2.95-1.8-2.95-1.8 0-2.07 1.4-2.07 2.85V21H10V9Z"
            />
          </svg>
          LinkedIn
        </a>
        <div class="toggle" role="group" aria-label="Language">
          <button type="button" data-set-lang="fr" aria-pressed="false">FR</button>
          <button type="button" data-set-lang="en" aria-pressed="true">EN</button>
        </div>
      </div>
    </main>

    <script>
      const i18n = {
        en: {
          badge: 'Building',
          role: 'Full Stack Developer',
          status: 'Site in progress — coming soon',
          title: 'Dylan Sohet — Site in progress',
        },
        fr: {
          badge: 'En construction',
          role: 'Développeur Full Stack',
          status: 'Site en construction — bientôt en ligne',
          title: 'Dylan Sohet — Site en construction',
        },
      };

      function setLang(lang) {
        const t = i18n[lang];
        document.documentElement.lang = lang;
        document.documentElement.dataset.lang = lang;
        document.title = t.title;
        document.querySelectorAll('[data-i18n]').forEach((n) => {
          const key = n.getAttribute('data-i18n');
          if (t[key]) n.textContent = t[key];
        });
        document.querySelectorAll('[data-set-lang]').forEach((b) => {
          b.setAttribute('aria-pressed', String(b.dataset.setLang === lang));
        });
      }

      document.querySelectorAll('[data-set-lang]').forEach((b) => {
        b.addEventListener('click', () => setLang(b.dataset.setLang));
      });
    </script>
  </body>
</html>
